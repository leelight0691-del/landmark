<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>랜드마크 주식회사 - 관광지 개발 프로젝트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1A30;
    --panel: #172746;
    --panel-hi: #1F3459;
    --line: #2C4270;
    --text: #F4F7FB;
    --muted: #93A6C7;
    --gold: #FFC857;
    --gold-dim: #7A6631;
    --coral: #FF6B6B;
    --mint: #4CD3A5;
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 20% 0%, #1B2D54 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }
  h1,h2,h3, .display{
    font-family: 'Jua', 'Noto Sans KR', sans-serif;
    font-weight: 400;
    letter-spacing: 0.2px;
  }
  button{
    font-family: inherit;
    cursor: pointer;
    border: none;
  }
  button:disabled{ cursor: not-allowed; opacity: 0.45; }
  .wrap{ max-width: 1180px; margin: 0 auto; padding: 0 20px; }

  /* ---------- Header ---------- */
  header.top{
    position: sticky; top: 0; z-index: 40;
    background: rgba(15,26,48,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
  }
  .top-row{ display:flex; align-items:center; justify-content:space-between; gap: 16px; flex-wrap: wrap;}
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .logo{
    width:40px; height:40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--gold), #FF9F4A);
    display:flex; align-items:center; justify-content:center;
    font-size: 20px; flex-shrink:0;
  }
  .brand-text h1{ font-size: 20px; margin:0; line-height:1.1; }
  .brand-text span{ font-size: 12px; color: var(--muted); }

  .stepper{ display:flex; align-items:center; gap:6px; }
  .step{
    display:flex; align-items:center; gap:6px;
    font-size: 12.5px; color: var(--muted);
    padding: 6px 10px; border-radius: 999px;
    border: 1px solid var(--line);
    white-space: nowrap;
  }
  .step .dot{ width:7px; height:7px; border-radius:50%; background: var(--line); }
  .step.active{ color: var(--bg); background: var(--gold); border-color: var(--gold); font-weight:600; }
  .step.active .dot{ background: var(--bg); }
  .step.done{ color: var(--mint); border-color: rgba(76,211,165,0.4); }
  .step.done .dot{ background: var(--mint); }

  .role-switch{ display:flex; gap:6px; background: var(--panel); padding:4px; border-radius: 999px; border:1px solid var(--line); }
  .role-switch button{
    background: transparent; color: var(--muted); padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight:600;
  }
  .role-switch button.active{ background: var(--gold); color: var(--bg); }

  /* ---------- Generic panels ---------- */
  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px;
  }
  .muted{ color: var(--muted); }
  .section-title{ font-size: 22px; margin: 0 0 4px 0; }
  .section-sub{ font-size: 14px; color: var(--muted); margin: 0 0 18px 0; }

  /* ---------- Gate (role pick) ---------- */
  .gate{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 70px 20px; text-align:center; }
  .gate h2{ font-size: 30px; margin: 4px 0 8px; }
  .gate-cards{ display:flex; gap:18px; margin-top: 26px; flex-wrap:wrap; justify-content:center; }
  .gate-card{
    width: 260px; background: var(--panel); border:1px solid var(--line); border-radius: var(--radius);
    padding: 26px 20px; text-align:center; transition: transform .15s ease, border-color .15s ease;
  }
  .gate-card:hover{ transform: translateY(-3px); border-color: var(--gold); }
  .gate-card .emoji{ font-size: 40px; }
  .gate-card h3{ margin: 10px 0 6px; font-size: 19px; }
  .gate-card p{ color: var(--muted); font-size: 13px; margin:0; line-height:1.5; }

  /* ---------- Group select ---------- */
  .group-pick{ display:flex; flex-wrap:wrap; gap: 10px; justify-content:center; margin-top: 18px;}
  .group-chip{
    background: var(--panel-hi); border: 1px solid var(--line); color: var(--text);
    padding: 12px 18px; border-radius: 14px; font-size: 15px; font-weight: 600;
  }
  .group-chip:hover{ border-color: var(--gold); }

  /* ---------- Capital bar ---------- */
  .capital-bar{
    display:flex; align-items:center; justify-content:space-between; gap: 16px; flex-wrap:wrap;
    background: linear-gradient(120deg, #1D3255, #16233F);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 22px; margin: 18px 0;
  }
  .capital-bar .who{ font-size: 14px; color: var(--muted); }
  .capital-bar .who b{ color: var(--text); font-size: 17px; }
  .capital-num{ font-family:'Jua'; font-size: 34px; color: var(--gold); }
  .capital-num span{ font-size: 16px; color: var(--muted); margin-left: 4px; font-family:'Noto Sans KR';}
  .pill-stat{ background: var(--panel); border:1px solid var(--line); border-radius: 12px; padding: 8px 14px; font-size: 13px; color: var(--muted); }
  .pill-stat b{ color: var(--text); }

  .banner{
    border-radius: 14px; padding: 12px 18px; font-size: 14px; margin-bottom: 16px;
    border: 1px solid; display:flex; gap:10px; align-items:center;
  }
  .banner.invest{ background: rgba(255,200,87,0.09); border-color: rgba(255,200,87,0.4); color: #FFD98A; }
  .banner.vote{ background: rgba(255,107,107,0.09); border-color: rgba(255,107,107,0.4); color: #FF9C9C; }
  .banner.settle{ background: rgba(76,211,165,0.09); border-color: rgba(76,211,165,0.4); color: #8FE9CC; }
  .banner.wait{ background: rgba(147,166,199,0.09); border-color: rgba(147,166,199,0.35); color: var(--muted); }

  /* ---------- Destination grid ---------- */
  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 14px; }
  .dest{
    border-radius: var(--radius); overflow:hidden; border: 1px solid var(--line);
    background: var(--panel);
    display:flex; flex-direction:column;
  }
  .dest-head{
    padding: 20px 18px 44px; position:relative; color: white;
    background-size: cover; background-position: center;
  }
  .dest-head::before{
    content:""; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(10,16,30,0.15) 0%, rgba(10,16,30,0.55) 65%, rgba(10,16,30,0.85) 100%);
  }
  .dest-head .emoji, .dest-head h3, .dest-head .region{ position:relative; z-index:1; }
  .dest-head .emoji{ font-size: 30px; display:block; margin-bottom: 8px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
  .dest-head h3{ margin: 0; font-size: 19px; text-shadow: 0 2px 6px rgba(0,0,0,0.55); }
  .dest-head .region{ font-size: 12px; opacity: 0.95; margin-top:2px; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  .dest-body{ padding: 14px 16px 18px; display:flex; flex-direction:column; gap:10px; margin-top:-26px; }
  .product{
    background: var(--panel-hi); border: 1px solid var(--line); border-radius: 13px; padding: 12px 14px;
  }
  .product-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .product-name{ font-size: 14.5px; font-weight: 600; line-height:1.35; }
  .product-desc{ font-size: 12.5px; color: var(--muted); margin: 4px 0 10px; line-height:1.5; }
  .tag-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom: 10px; }
  .tag{ font-size: 11.5px; padding: 3px 8px; border-radius: 999px; border:1px solid var(--line); color: var(--muted); }
  .tag.cost{ color: var(--coral); border-color: rgba(255,107,107,0.4); background: rgba(255,107,107,0.08); }
  .tag.profit{ color: var(--gold); border-color: rgba(255,200,87,0.4); background: rgba(255,200,87,0.08); }
  .tag.votes{ color: var(--mint); border-color: rgba(76,211,165,0.4); background: rgba(76,211,165,0.08); }
  .tag.mine{ color: #9AD1FF; border-color: rgba(154,209,255,0.4); background: rgba(154,209,255,0.08); }
  .act-btn{
    width:100%; padding: 9px 0; border-radius: 10px; font-size: 13.5px; font-weight: 700;
    background: var(--gold); color: #26200A;
  }
  .act-btn.on{ background: var(--panel); color: var(--gold); border: 1px solid var(--gold); }
  .act-btn.vote-btn{ background: var(--coral); color: #2C0A0A; }
  .act-btn.vote-btn.on{ background: var(--panel); color: var(--coral); border: 1px solid var(--coral); }
  .revenue-line{ display:flex; justify-content:space-between; font-size: 13px; padding-top:8px; border-top: 1px dashed var(--line); }
  .revenue-line b{ color: var(--mint); }

  /* ---------- Setup (teacher) ---------- */
  .add-form{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom: 18px; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12px; color: var(--muted); }
  .field input{
    background: var(--panel-hi); border:1px solid var(--line); border-radius: 10px; color: var(--text);
    padding: 10px 12px; font-size: 14px; width: 160px;
  }
  .field input:focus{ outline: 2px solid var(--gold); }
  .btn{ padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 700; }
  .btn-gold{ background: var(--gold); color:#26200A; }
  .btn-ghost{ background: var(--panel-hi); color: var(--text); border: 1px solid var(--line); }
  .btn-coral{ background: var(--coral); color:#2C0A0A; }
  .btn-mint{ background: var(--mint); color:#0A2C20; }

  table.roster{ width:100%; border-collapse: collapse; margin-top: 6px; }
  table.roster th, table.roster td{ text-align:left; padding: 10px 12px; font-size:13.5px; border-bottom: 1px solid var(--line); }
  table.roster th{ color: var(--muted); font-weight:600; font-size:12px; }
  table.roster td.num{ color: var(--gold); font-weight:700; }
  .del-btn{ background:transparent; color: var(--muted); font-size:12px; text-decoration: underline; }

  /* ---------- Leaderboard ---------- */
  .lb-row{
    display:flex; align-items:center; gap: 14px; padding: 14px 16px; border-radius: 14px; margin-bottom: 10px;
    background: var(--panel-hi); border: 1px solid var(--line);
  }
  .lb-row.first{ border-color: var(--gold); background: linear-gradient(120deg, rgba(255,200,87,0.14), rgba(255,200,87,0.03)); }
  .lb-rank{ font-family:'Jua'; font-size: 22px; width: 34px; text-align:center; color: var(--muted); }
  .lb-row.first .lb-rank{ color: var(--gold); }
  .lb-name{ flex:1; }
  .lb-name b{ font-size:15.5px; }
  .lb-name .sub{ font-size:12px; color: var(--muted); }
  .lb-final{ font-family:'Jua'; font-size: 22px; color: var(--mint); }

  .footer-note{ text-align:center; color: var(--muted); font-size: 12px; margin-top: 40px; }

  @media (max-width: 640px){
    .capital-num{ font-size: 26px; }
    .brand-text h1{ font-size: 17px; }
  }
</style>
</head>

      <div class="logo">🏢</div>
      <div class="brand-text">
        <h1>랜드마크 주식회사</h1>

const ALL_PRODUCTS = DESTINATIONS.flatMap(d => d.products.map(p => ({...p, destId:d.id, destName:d.name})));
const MAX_VOTES = 5;
const PHASES = ["setup","invest","vote","settle"];
const PHASE_LABEL = { setup:"팀 설정", invest:"투자 TIME", vote:"관광 TIME (투표)", settle:"정산 TIME" };

let groupsById = {};      // id -> {id,name,capital,invests:[],members:[],votesByMember:{}}

/* ============================= storage helpers ============================= */
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

// 저장 서버가 순간적으로 요청이 몰릴 때(rate limit) 실패할 수 있어 짧게 재시도한다
async function sGet(key, attempt){
  attempt = attempt || 0;
  try{
    const snapshot = await get(ref(database, key));
    return snapshot.exists() ? snapshot.val() : null;
  }catch(e){
    if(attempt < 2){ await sleep(350 * (attempt + 1)); return sGet(key, attempt + 1); }
    console.error("Firebase get failed", key, e);
    return null;
  }
}
async function sSet(key, value, attempt){
  attempt = attempt || 0;
  try{
    await set(ref(database, key), value);
    return true;
  }catch(e){
    if(attempt < 3){ await sleep(500 * (attempt + 1)); return sSet(key, value, attempt + 1); }
    console.error("Firebase set failed after retries", key, e);
    showToast("저장이 지연되고 있어요. 잠시 후 다시 시도해 주세요.");
    return false;
  }
}
async function sDelete(key){
  try{ await remove(ref(database, key)); }
  catch(e){ console.error("Firebase delete failed", key, e); }
}

/* ============================= 데이터 로드/실시간 동기화 ============================= */
/*
  Firebase Realtime Database의 루트 데이터를 한 번 구독합니다.
  교사 또는 다른 팀이 팀 생성·투자·투표·단계 변경을 하면 모든 접속 화면이 즉시 갱신됩니다.
*/
function applyRemoteData(data){
  const root = data || {};
  phase = root["phase"] || "setup";
  groupIds = root["groups-index"] || [];

  groupsById = {};
  groupIds.forEach(id => {
    const g = root["group:" + id];
    if(g) groupsById[id] = g;
  });

  render();
}

function startRealtimeSync(){
  onValue(
    ref(database),
    (snapshot) => {
      applyRemoteData(snapshot.val());
    },
    (error) => {
      console.error("Firebase realtime sync failed", error);
      showToast("실시간 동기화에 문제가 있어요. 인터넷 연결을 확인해 주세요.");
    }
  );
}

/*
  기존 액션 함수(addGroup, setPhase 등)에서 await refreshAll()을 그대로 사용하기 위한
  즉시 새로고침 함수입니다. 평상시에는 onValue가 자동으로 모든 기기를 동기화합니다.
*/
async function refreshAll(){
  const snapshot = await get(ref(database));
  applyRemoteData(snapshot.val());
}

/* ============================= actions ============================= */
async function addGroup(name, capital, membersText){
  if(!name || !capital || capital <= 0) return;
  const id = "g" + Date.now() + Math.floor(Math.random()*1000);
  let members = (membersText || "").split(",").map(s => s.trim()).filter(Boolean);
  if(members.length === 0) members = [name];
  const votesByMember = {};
  members.forEach(m => { votesByMember[m] = []; });
  const g = { id, name, capital: Number(capital), invests: [], members, votesByMember };
  const ok = await sSet("group:"+id, g);
  if(!ok) return;
  const idx = (await sGet("groups-index")) || [];
  idx.push(id);
  await sSet("groups-index", idx);
  await refreshAll();
}
async function addSampleGroups(){
  const samples = [
    ["1팀",200,"민준,서연,하윤"],
    ["2팀",200,"도윤,지우,아린"],
    ["3팀",200,"시우,다은,예준"],
    ["4팀",200,"주안,수아,은우"],
  ];
  const newIds = [];
  for(let i = 0; i < samples.length; i++){
    const [n, c, m] = samples[i];
    const id = "g" + Date.now() + i + Math.floor(Math.random()*1000);
    let members = m.split(",").map(s => s.trim()).filter(Boolean);
    const votesByMember = {};
    members.forEach(mm => { votesByMember[mm] = []; });
    const g = { id, name: n, capital: Number(c), invests: [], members, votesByMember };
    const ok = await sSet("group:"+id, g);
    if(ok) newIds.push(id);
    await sleep(300); // 저장 요청이 한꺼번에 몰리지 않도록 약간의 간격을 둔다
  }
  const idx = (await sGet("groups-index")) || [];
  await sSet("groups-index", [...idx, ...newIds]);
  await refreshAll();
}
async function removeGroup(id){
  await sDelete("group:"+id);
  const idx = ((await sGet("groups-index")) || []).filter(x => x !== id);
  await sSet("groups-index", idx);
  await refreshAll();
}
async function setPhase(next){
  await sSet("phase", next);
  await refreshAll();
}
async function resetGame(){
  for(const id of groupIds){ await sDelete("group:"+id); }
  await sSet("groups-index", []);
  await sSet("phase", "setup");
  myGroupId = null;
  await refreshAll();
}

function remainingCapital(g){
  const spent = g.invests.reduce((sum,pid) => {
    const p = ALL_PRODUCTS.find(x => x.id === pid);
    return sum + (p ? p.cost : 0);
  }, 0);
  return g.capital - spent;
}
function voteTally(productId){
  let n = 0;
  groupIds.forEach(id => {
    const g = groupsById[id];
    if(!g || !g.votesByMember) return;
    Object.values(g.votesByMember).forEach(arr => { if(arr.includes(productId)) n++; });
  });
  return n;
}
function memberVotes(g, member){
  return (g.votesByMember && g.votesByMember[member]) || [];
}
function teamVoteProgress(g){
  const members = g.members || [g.name];
  const cast = members.reduce((sum, m) => sum + memberVotes(g, m).length, 0);
  return { cast, max: members.length * MAX_VOTES, members };
}
async function toggleInvest(productId){
  const g = groupsById[myGroupId];
  if(!g || phase !== "invest") return;
  const has = g.invests.includes(productId);
  if(has){
    g.invests = g.invests.filter(x => x !== productId);
  } else {
    const p = ALL_PRODUCTS.find(x => x.id === productId);
    if(remainingCapital(g) < p.cost) return;
    g.invests = [...g.invests, productId];
  }
  await sSet("group:"+myGroupId, g);
  await refreshAll();
}
async function toggleVote(productId){
  const g = groupsById[myGroupId];
  if(!g || phase !== "vote" || !myVoter) return;
  if(!g.votesByMember) g.votesByMember = {};
  const mine = g.votesByMember[myVoter] || [];
  const has = mine.includes(productId);
  if(has){
    g.votesByMember[myVoter] = mine.filter(x => x !== productId);
  } else {
    if(mine.length >= MAX_VOTES) return;
    g.votesByMember[myVoter] = [...mine, productId];
  }
  await sSet("group:"+myGroupId, g);
  await refreshAll();
}
function settlementFor(g){
  let totalInvested = 0, totalRevenue = 0;
  const lines = g.invests.map(pid => {
    const p = ALL_PRODUCTS.find(x => x.id === pid);
    const visitors = voteTally(pid);
    const revenue = visitors * p.profit;
    totalInvested += p.cost;
    totalRevenue += revenue;
    return { ...p, visitors, revenue };
  });
  const finalCapital = g.capital - totalInvested + totalRevenue;
  return { lines, totalInvested, totalRevenue, finalCapital };
}

/* ============================= render: shell ============================= */
function render(){
  // 입력 중인 텍스트/포커스는 재렌더링 후에도 그대로 유지되도록 저장해둔다
  const active = document.activeElement;
  let savedFocus = null;
  if(active && active.id && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")){
    savedFocus = { id: active.id, value: active.value, start: active.selectionStart, end: active.selectionEnd };
  }

  renderStepper();
  renderRoleSwitch();
  const app = document.getElementById("app");
  if(!role){ app.innerHTML = renderGate(); attachGateEvents(); }
  else if(role === "teacher"){ app.innerHTML = renderTeacher(); attachTeacherEvents(); }
  else if(role === "group"){
    if(!myGroupId){ app.innerHTML = renderGroupPick(); attachGroupPickEvents(); }
    else if(!groupsById[myGroupId]){ myGroupId = null; app.innerHTML = renderGroupPick(); attachGroupPickEvents(); }
    else { app.innerHTML = renderGroupView(); attachGroupViewEvents(); }
  }

  if(savedFocus){
    const el = document.getElementById(savedFocus.id);
    if(el){
      el.value = savedFocus.value;
      el.focus();
      try{ el.setSelectionRange(savedFocus.start, savedFocus.end); }catch(e){ /* number 입력 등은 지원 안 함 */ }
    }
  }
}

function renderStepper(){
  const mount = document.getElementById("stepperMount");
  mount.innerHTML = PHASES.map((p, i) => {
    const idx = PHASES.indexOf(phase);
    let cls = "step";
    if(p === phase) cls += " active";
    else if(i < idx) cls += " done";
    return `<div class="${cls}"><span class="dot"></span>${i+1}. ${PHASE_LABEL[p]}</div>`;
  }).join("");
}

    <button data-role="group" class="${role==='group'?'active':''}">🧑‍🤝‍🧑 팀 화면</button>

  mount.querySelectorAll("button").forEach(btn => {

  }).filter(Boolean).sort((a,b) => b.s.finalCapital - a.s.finalCapital);

  const topProducts = [...ALL_PRODUCTS].map(p => ({...p, visitors: voteTally(p.id)}))

  return `

          <div class="lb-name">
            <b>${escapeHtml(r.g.name)}</b>
            <div class="sub">투자 ${r.s.totalInvested} · 수익 ${r.s.totalRevenue} · 시작자본 ${r.g.capital}</div>
          </div>
          <div class="lb-final">${r.s.finalCapital}</div>
        </div>
      `).join("")}
    </div>
    <div class="panel">
      <h2 class="section-title" style="font-size:18px;">🔥 가장 인기 있었던 관광 상품 TOP 5</h2>
      <table class="roster">
        <thead><tr><th>관광 상품</th><th>지형</th><th>관광객 수</th><th>1인당 순이익</th></tr></thead>
        <tbody>
          ${topProducts.map(p => `<tr>
            <td>${escapeHtml(p.name)}</td>
            <td>${escapeHtml(p.destName)}</td>
            <td class="num">${p.visitors}표</td>
            <td>+${p.profit}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
}
function phaseBannerText(isTeacher){
  if(phase === "setup") return "👋 팀을 추가하고 투자 TIME을 시작해 주세요.";
  if(phase === "invest") return "💰 투자 TIME! 팀들이 관광지에 개발비를 투자하고 있어요.";
  if(phase === "vote") return "🗳️ 관광 TIME! 가장 가고 싶은 관광 상품에 투표해요. (팀당 5표)";
  if(phase === "settle") return "📊 정산 TIME! 순이익이 공개되고 최종 결과가 나왔어요.";
  return "";
}
function attachTeacherEvents(){
  const addBtn = document.getElementById("addGroupBtn");
  if(addBtn) addBtn.onclick = async () => {
    const name = document.getElementById("newGroupName").value.trim();
    const capital = Number(document.getElementById("newGroupCapital").value);
    const membersText = document.getElementById("newGroupMembers").value.trim();
    await addGroup(name, capital, membersText);
  };
  const sampleBtn = document.getElementById("addSampleBtn");
  if(sampleBtn) sampleBtn.onclick = addSampleGroups;
  document.querySelectorAll(".del-btn").forEach(el => { el.onclick = () => removeGroup(el.dataset.id); });

  const s1 = document.getElementById("startInvestBtn"); if(s1) s1.onclick = () => setPhase("invest");
  const s2 = document.getElementById("startVoteBtn"); if(s2) s2.onclick = () => setPhase("vote");
  const s3 = document.getElementById("startSettleBtn"); if(s3) s3.onclick = () => setPhase("settle");
  const b1 = document.getElementById("backSetupBtn"); if(b1) b1.onclick = () => setPhase("setup");
  const b2 = document.getElementById("backInvestBtn"); if(b2) b2.onclick = () => setPhase("invest");
  const rb = document.getElementById("resetBtn");
  if(rb) rb.onclick = () => { if(confirm("정말 전체 게임을 초기화할까요? 모든 팀 데이터가 사라져요.")) resetGame(); };
}

/* ============================= render: group view ============================= */
function renderGroupView(){
  const g = groupsById[myGroupId];
  const remain = remainingCapital(g);
  const vp = teamVoteProgress(g);
  let banner = "";
  if(phase === "setup") banner = `<div class="banner wait">선생님이 게임을 준비하고 있어요. 곧 투자 TIME이 시작돼요!</div>`;
  else if(phase === "invest") banner = `<div class="banner invest">💰 마음에 드는 관광 상품에 투자해 보세요! 자본금이 부족하면 투자할 수 없어요.</div>`;
  else if(phase === "vote") banner = myVoter
    ? `<div class="banner vote">🗳️ <b>${escapeHtml(myVoter)}</b>님, 가장 가고 싶은 관광 상품 ${MAX_VOTES}곳에 투표하세요! (남은 표: ${MAX_VOTES - memberVotes(g, myVoter).length}표) 순이익은 정산 때 공개돼요.</div>`
    : `<div class="banner vote">🗳️ 팀원이 한 명씩 태블릿을 넘겨받아 각자 5표씩 투표해요. 아래에서 내 이름을 골라 주세요!</div>`;
  else if(phase === "settle") banner = `<div class="banner settle">📊 정산이 완료됐어요! 우리 팀이 투자한 곳의 결과를 확인해 보세요.</div>`;

  let settleSummary = "";
  if(phase === "settle"){
    const s = settlementFor(g);
    settleSummary = `
      <div class="panel" style="margin-bottom:18px;">
        <h2 class="section-title" style="font-size:18px;">우리 팀 정산 결과</h2>
        <table class="roster">
          <thead><tr><th>투자한 곳</th><th>개발비</th><th>관광객 수</th><th>1인당 순이익</th><th>수익</th></tr></thead>
          <tbody>
            ${s.lines.length === 0 ? `<tr><td colspan="5" class="muted">투자한 상품이 없어요.</td></tr>` :
              s.lines.map(l => `<tr>
                <td>${escapeHtml(l.name)}</td>
                <td>-${l.cost}</td>
                <td>${l.visitors}표</td>
                <td>+${l.profit}</td>
                <td class="num">+${l.revenue}</td>
              </tr>`).join("")}
          </tbody>
        </table>
        <div class="capital-bar" style="margin-top:14px;">
          <div class="who">최종 자본금<br><b>시작 ${g.capital} - 투자 ${s.totalInvested} + 수익 ${s.totalRevenue}</b></div>
          <div class="capital-num">${s.finalCapital}<span>원</span></div>
        </div>
      </div>
    `;
  }

  // 투표 TIME인데 아직 투표할 사람을 고르지 않았다면, 팀원 선택 화면만 보여준다
  if(phase === "vote" && !myVoter){
    return `
      <div class="capital-bar">
        <div class="who">${escapeHtml(g.name)} · <span class="muted">${PHASE_LABEL[phase]}</span></div>
        <div class="pill-stat">우리 팀 투표 진행 <b>${vp.cast}</b> / ${vp.max}표</div>
      </div>
      ${banner}
      <div class="panel">
        <h2 class="section-title" style="font-size:18px;">누가 투표할 차례인가요?</h2>
        <p class="section-sub">한 명씩 이름을 고르고, 5표를 다 던진 뒤 다음 사람에게 태블릿을 넘겨주세요.</p>
        <div class="group-pick" style="justify-content:flex-start;">
          ${vp.members.map(m => {
            const done = memberVotes(g, m).length >= MAX_VOTES;
            return `<button class="group-chip" data-member="${escapeHtml(m)}" style="${done ? 'border-color:var(--mint); color:var(--mint);' : ''}">
              ${done ? "✅ " : ""}${escapeHtml(m)} (${memberVotes(g, m).length}/${MAX_VOTES})
            </button>`;
          }).join("")}
        </div>
      </div>
    `;
  }

  return `
    <div class="capital-bar">
      <div class="who">${escapeHtml(g.name)} · <span class="muted">${PHASE_LABEL[phase]}</span></div>
      <div class="capital-num">${phase==='settle' ? settlementFor(g).finalCapital : remain}<span>원 ${phase==='settle'?'(최종)':'(남은 자본금)'}</span></div>
      <div class="pill-stat">
        투자 <b>${g.invests.length}</b>곳
        ${phase === 'vote' ? ` · ${escapeHtml(myVoter)} <b>${memberVotes(g, myVoter).length}/${MAX_VOTES}</b>표` : ""}
        ${phase !== 'vote' && phase !== 'invest' ? ` · 팀 투표 <b>${vp.cast}/${vp.max}</b>` : ""}
      </div>
      ${phase === 'vote' ? `<button class="btn btn-ghost" id="switchVoterBtn">다른 팀원으로 전환</button>` : ""}
    </div>
    ${banner}
    ${settleSummary}
    <div class="grid">
      ${DESTINATIONS.map(d => renderDestCard(d, g)).join("")}
    </div>
  `;
}
function renderDestCard(d, g){
  return `
    <div class="dest">
      <div class="dest-head" style="background-image:url('${PHOTOS[d.id]}');">
        <span class="emoji">${d.emoji}</span>
        <h3>${escapeHtml(d.name)}</h3>
        <div class="region">${escapeHtml(d.region)}</div>
      </div>
      <div class="dest-body">
        ${d.products.map(p => renderProduct(p, g)).join("")}
      </div>
    </div>
  `;
}
function renderProduct(p, g){
  const invested = g.invests.includes(p.id);
  const myVotes = myVoter ? memberVotes(g, myVoter) : [];
  const voted = myVotes.includes(p.id);
  const visitors = voteTally(p.id);
  let actionHtml = "";
  if(phase === "invest"){
    const canAfford = invested || remainingCapital(g) >= p.cost;
    actionHtml = `<button class="act-btn ${invested?'on':''}" data-invest="${p.id}" ${canAfford?"":"disabled"}>
      ${invested ? "투자 취소하기" : "투자하기"}
    </button>`;
  } else if(phase === "vote"){
    const canVote = voted || myVotes.length < MAX_VOTES;
    actionHtml = `<button class="act-btn vote-btn ${voted?'on':''}" data-vote="${p.id}" ${canVote?"":"disabled"}>
      ${voted ? "투표 취소하기" : "투표하기"}
    </button>`;
  } else if(phase === "settle"){
    if(invested){
      actionHtml = `<div class="revenue-line"><span>관광객 ${visitors}표 × 순이익 ${p.profit}</span><b>+${visitors*p.profit}</b></div>`;
    } else {
      actionHtml = `<div class="muted" style="font-size:12.5px;">투자하지 않은 상품이에요</div>`;
    }
  } else {
    actionHtml = `<div class="muted" style="font-size:12.5px;">대기 중</div>`;
  }

  return `
    <div class="product">
      <div class="product-top">
        <div class="product-name">${escapeHtml(p.name)}</div>
      </div>
      <div class="product-desc">${escapeHtml(p.desc)}</div>
      <div class="tag-row">
        <span class="tag cost">개발비 -${p.cost}</span>
        ${phase === "settle" ? `<span class="tag profit">순이익 +${p.profit}</span>` : `<span class="tag">순이익 비공개</span>`}
        ${phase !== "invest" ? `<span class="tag votes">투표 ${visitors}표</span>` : ""}
        ${invested ? `<span class="tag mine">내가 투자함</span>` : ""}
      </div>
      ${actionHtml}
    </div>
  `;
}
function attachGroupViewEvents(){
  document.querySelectorAll("[data-invest]").forEach(el => { el.onclick = () => toggleInvest(el.dataset.invest); });
  document.querySelectorAll("[data-vote]").forEach(el => { el.onclick = () => toggleVote(el.dataset.vote); });
  document.querySelectorAll("[data-member]").forEach(el => { el.onclick = () => { myVoter = el.dataset.member; render(); }; });
  const sw = document.getElementById("switchVoterBtn");
  if(sw) sw.onclick = () => { myVoter = null; render(); };
}

/* ============================= utils ============================= */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* ============================= init ============================= */
startRealtimeSync();
</script>
</body>
</html>
