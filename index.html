<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>랜드마크 주식회사 - 관광지 개발 프로젝트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1A30; --panel: #172746; --panel-hi: #1F3459; --line: #2C4270;
    --text: #F4F7FB; --muted: #93A6C7; --gold: #FFC857; --coral: #FF6B6B; --mint: #4CD3A5;
    --sky: #7FB8E0; --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 20% 0%, #1B2D54 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    min-height: 100vh; padding-bottom: 60px;
  }
  h1,h2,h3,.display{ font-family:'Jua','Noto Sans KR',sans-serif; font-weight:400; letter-spacing:0.2px; }
  button{ font-family:inherit; cursor:pointer; border:none; }
  button:disabled{ cursor:not-allowed; opacity:0.45; }
  input, textarea, select{ font-family:inherit; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 20px; }

  /* Header */
  header.top{ position:sticky; top:0; z-index:40; background:rgba(15,26,48,0.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:14px 0; }
  .top-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .logo{ width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg,var(--gold),#FF9F4A); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .brand-text h1{ font-size:20px; margin:0; line-height:1.1; }
  .brand-text span{ font-size:12px; color:var(--muted); }
  .stepper{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .step{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); padding:6px 10px; border-radius:999px; border:1px solid var(--line); white-space:nowrap; }
  .step .dot{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .step.active{ color:var(--bg); background:var(--gold); border-color:var(--gold); font-weight:600; }
  .step.active .dot{ background:var(--bg); }
  .step.done{ color:var(--mint); border-color:rgba(76,211,165,0.4); }
  .step.done .dot{ background:var(--mint); }
  .role-switch{ display:flex; gap:6px; background:var(--panel); padding:4px; border-radius:999px; border:1px solid var(--line); }
  .role-switch button{ background:transparent; color:var(--muted); padding:7px 14px; border-radius:999px; font-size:13px; font-weight:600; }
  .role-switch button.active{ background:var(--gold); color:var(--bg); }

  /* Panels */
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px; }
  .panel + .panel{ margin-top:16px; }
  .muted{ color:var(--muted); }
  .section-title{ font-size:22px; margin:0 0 4px 0; }
  .section-sub{ font-size:14px; color:var(--muted); margin:0 0 18px 0; line-height:1.5; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .row.end{ justify-content:flex-end; }
  .two-col{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width: 860px){ .two-col{ grid-template-columns:1fr; } }

  /* Gate */
  .gate{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; text-align:center; }
  .gate h2{ font-size:30px; margin:4px 0 8px; }
  .gate-cards{ display:flex; gap:18px; margin-top:26px; flex-wrap:wrap; justify-content:center; }
  .gate-card{ width:240px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:26px 20px; text-align:center; transition:transform .15s ease, border-color .15s ease; cursor:pointer; }
  .gate-card:hover{ transform:translateY(-3px); border-color:var(--gold); }
  .gate-card .emoji{ font-size:40px; }
  .gate-card h3{ margin:10px 0 6px; font-size:19px; }
  .gate-card p{ color:var(--muted); font-size:13px; margin:0; line-height:1.5; }
  .group-pick{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:18px; }
  .group-chip{ background:var(--panel-hi); border:1px solid var(--line); color:var(--text); padding:12px 18px; border-radius:14px; font-size:15px; font-weight:600; }
  .group-chip:hover{ border-color:var(--gold); }

  /* Capital bar & banner */
  .capital-bar{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; background:linear-gradient(120deg,#1D3255,#16233F); border:1px solid var(--line); border-radius:var(--radius); padding:18px 22px; margin:18px 0; }
  .capital-bar .who{ font-size:14px; color:var(--muted); }
  .capital-bar .who b{ color:var(--text); font-size:17px; }
  .capital-num{ font-family:'Jua'; font-size:34px; color:var(--gold); }
  .capital-num span{ font-size:16px; color:var(--muted); margin-left:4px; font-family:'Noto Sans KR'; }
  .pill-stat{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 14px; font-size:13px; color:var(--muted); }
  .pill-stat b{ color:var(--text); }
  .banner{ border-radius:14px; padding:12px 18px; font-size:14px; margin-bottom:16px; border:1px solid; display:flex; gap:10px; align-items:center; line-height:1.5; }
  .banner.develop{ background:rgba(255,200,87,0.09); border-color:rgba(255,200,87,0.4); color:#FFD98A; }
  .banner.vote{ background:rgba(255,107,107,0.09); border-color:rgba(255,107,107,0.4); color:#FF9C9C; }
  .banner.settle{ background:rgba(76,211,165,0.09); border-color:rgba(76,211,165,0.4); color:#8FE9CC; }
  .banner.wait, .banner.setup{ background:rgba(147,166,199,0.09); border-color:rgba(147,166,199,0.35); color:var(--muted); }

  /* Tabs & chips */
  .tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .tab{ background:var(--panel-hi); border:1px solid var(--line); color:var(--muted); padding:10px 18px; border-radius:12px; font-size:15px; font-weight:700; }
  .tab.active{ background:var(--gold); color:var(--bg); border-color:var(--gold); }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ background:var(--panel-hi); border:1px solid var(--line); color:var(--text); padding:8px 13px; border-radius:999px; font-size:13.5px; }
  .chip.on{ background:rgba(76,211,165,0.18); border-color:var(--mint); color:#C8F5E6; }
  .chip.custom{ border-style:dashed; }
  .chip small{ color:var(--muted); font-size:11px; margin-left:4px; }

  /* Cards */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; margin-top:14px; }
  .grid.wide{ grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); }
  .dest{ border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; }
  .dest-head{ padding:20px 18px 44px; position:relative; color:white; background-size:cover; background-position:center; }
  .dest-head::before{ content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(10,16,30,0.15) 0%,rgba(10,16,30,0.55) 65%,rgba(10,16,30,0.85) 100%); }
  .dest-head .emoji,.dest-head h3,.dest-head .region,.dest-head .desc{ position:relative; z-index:1; }
  .dest-head .emoji{ font-size:30px; display:block; margin-bottom:8px; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
  .dest-head h3{ margin:0; font-size:19px; text-shadow:0 2px 6px rgba(0,0,0,0.55); }
  .dest-head .region{ font-size:12px; opacity:0.95; margin-top:2px; text-shadow:0 1px 4px rgba(0,0,0,0.6); }
  .dest-head .desc{ font-size:12.5px; margin-top:8px; line-height:1.5; text-shadow:0 1px 4px rgba(0,0,0,0.7); }
  .dest-body{ padding:14px 16px 18px; display:flex; flex-direction:column; gap:10px; margin-top:-26px; }
  .product{ background:var(--panel-hi); border:1px solid var(--line); border-radius:13px; padding:12px 14px; }
  .product.winner{ border-color:var(--gold); box-shadow:0 0 0 2px rgba(255,200,87,0.25); }
  .product-name{ font-size:15px; font-weight:700; line-height:1.35; }
  .product-desc{ font-size:13px; color:var(--muted); margin:4px 0 10px; line-height:1.5; }
  .tag-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .tag{ font-size:11.5px; padding:3px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .tag.cost{ color:var(--coral); border-color:rgba(255,107,107,0.4); background:rgba(255,107,107,0.08); }
  .tag.profit{ color:var(--gold); border-color:rgba(255,200,87,0.4); background:rgba(255,200,87,0.08); }
  .tag.votes{ color:var(--mint); border-color:rgba(76,211,165,0.4); background:rgba(76,211,165,0.08); }
  .tag.team{ color:#9AD1FF; border-color:rgba(154,209,255,0.4); background:rgba(154,209,255,0.08); }
  .tag.act{ color:#C8F5E6; }
  .act-btn{ width:100%; padding:10px 0; border-radius:10px; font-size:14px; font-weight:700; background:var(--gold); color:#26200A; }
  .act-btn.on{ background:var(--panel); color:var(--gold); border:1px solid var(--gold); }
  .revenue-line{ display:flex; justify-content:space-between; font-size:13px; padding-top:8px; border-top:1px dashed var(--line); }
  .revenue-line b{ color:var(--mint); }

  /* Forms */
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12.5px; color:var(--muted); }
  .field input, .field textarea, .field select{ background:var(--panel-hi); border:1px solid var(--line); border-radius:10px; color:var(--text); padding:11px 12px; font-size:15px; width:100%; }
  .field input:focus, .field textarea:focus{ outline:2px solid var(--gold); }
  .field.inline input{ width:160px; }
  .add-form{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:18px; }
  .btn{ padding:10px 18px; border-radius:10px; font-size:14px; font-weight:700; }
  .btn.big{ padding:14px 22px; font-size:16px; }
  a.btn{ text-decoration:none; display:inline-block; }
  .btn-gold{ background:var(--gold); color:#26200A; }
  .btn-ghost{ background:var(--panel-hi); color:var(--text); border:1px solid var(--line); }
  .btn-coral{ background:var(--coral); color:#2C0A0A; }
  .btn-mint{ background:var(--mint); color:#0A2C20; }
  .btn-sky{ background:var(--sky); color:#0A1C2C; }
  .form-steps{ display:flex; flex-direction:column; gap:16px; }
  .form-step{ background:rgba(0,0,0,0.15); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .form-step h4{ margin:0 0 10px; font-size:15px; display:flex; align-items:center; gap:8px; }
  .form-step h4 .num{ width:24px; height:24px; border-radius:50%; background:var(--gold); color:var(--bg); display:inline-flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; }
  .ai-box{ background:rgba(127,184,224,0.1); border:1px solid rgba(127,184,224,0.4); border-radius:14px; padding:14px 16px; line-height:1.6; font-size:14px; }
  .ai-box b{ color:var(--sky); }
  .ai-box .total{ font-family:'Jua'; font-size:24px; color:var(--gold); }
  .idea-card{ background:var(--panel-hi); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:6px; }
  .idea-card .name{ font-weight:700; font-size:15px; }
  .idea-card .ad{ font-size:13px; color:var(--muted); }
  .region-pick{ display:flex; gap:10px; flex-wrap:wrap; }
  .region-btn{ flex:1; min-width:200px; text-align:left; background:var(--panel-hi); border:2px solid var(--line); color:var(--text); border-radius:14px; padding:12px 14px; }
  .region-btn.on{ border-color:var(--gold); background:rgba(255,200,87,0.1); }
  .region-btn b{ display:block; font-size:15px; }
  .region-btn span{ font-size:12px; color:var(--muted); }

  /* Tables */
  table.roster{ width:100%; border-collapse:collapse; margin-top:6px; }
  table.roster th, table.roster td{ text-align:left; padding:10px 12px; font-size:13.5px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.roster th{ color:var(--muted); font-weight:600; font-size:12px; }
  table.roster td.num{ color:var(--gold); font-weight:700; }
  .del-btn{ background:transparent; color:var(--muted); font-size:12px; text-decoration:underline; }

  /* Leaderboard */
  .lb-row{ display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:14px; margin-bottom:10px; background:var(--panel-hi); border:1px solid var(--line); }
  .lb-row.first{ border-color:var(--gold); background:linear-gradient(120deg,rgba(255,200,87,0.14),rgba(255,200,87,0.03)); }
  .lb-rank{ font-family:'Jua'; font-size:22px; width:34px; text-align:center; color:var(--muted); }
  .lb-row.first .lb-rank{ color:var(--gold); }
  .lb-name{ flex:1; }
  .lb-name b{ font-size:15.5px; }
  .lb-name .sub{ font-size:12px; color:var(--muted); }
  .lb-final{ font-family:'Jua'; font-size:22px; color:var(--mint); }

  /* Rounds / QR / stars */
  .round-row{ display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:var(--panel-hi); margin-bottom:10px; flex-wrap:wrap; }
  .round-row .name{ flex:1; font-weight:700; font-size:15px; }
  .status{ font-size:12px; padding:4px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .status.open{ color:#FF9C9C; border-color:rgba(255,107,107,0.5); background:rgba(255,107,107,0.1); }
  .status.closed{ color:var(--mint); border-color:rgba(76,211,165,0.5); background:rgba(76,211,165,0.1); }
  .qr-box{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .qr-box #qr{ background:white; padding:10px; border-radius:12px; width:180px; height:180px; display:flex; align-items:center; justify-content:center; }
  .qr-box #qr img, .qr-box #qr canvas{ display:block; }
  .qr-url{ font-size:12px; color:var(--muted); word-break:break-all; }
  .stars{ display:flex; gap:6px; }
  .star{ font-size:30px; background:transparent; color:#3A4F78; padding:2px 4px; line-height:1; }
  .star.on{ color:var(--gold); }
  .score-big{ font-family:'Jua'; font-size:28px; color:var(--gold); }
  .live-count{ font-family:'Jua'; font-size:20px; color:var(--coral); }
  .vote-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:14px; }
  .vote-card .product-name{ font-size:18px; }
  .footer-note{ text-align:center; color:var(--muted); font-size:12px; margin-top:40px; }
  @media (max-width:640px){ .capital-num{ font-size:26px; } .brand-text h1{ font-size:17px; } .stepper{ display:none; } }
</style>
</head>

      <div class="logo">🏢</div>
      <div class="brand-text">
        <h1>랜드마크 주식회사</h1>
        <span>관광지 개발 프로젝트</span>
      </div>
    </div>
    <div id="stepperMount" class="stepper"></div>
    <div class="role-switch" id="roleSwitch"></div>
  </div>
</header>

<main class="wrap" id="app" style="padding-top:22px;"></main>
<p class="footer-note">6학년 세계의 자연과 문화 · 지형 경관을 활용한 관광 산업 · 관광 상품 개발 & 설명회 투표</p>

function emptyState(){ return { phase:"setup", settings:{...DEFAULT_SETTINGS}, groups:{}, rounds:{ current:null, status:{} }, voters:{} }; }
function newDraft(){ return { region:null, name:"", ad:"", acts:[], customAct:"", ai:null }; }
function normalize(raw){
  const st = emptyState();
  if(!raw || typeof raw !== "object") return st;
  st.phase = PHASES.includes(raw.phase) ? raw.phase : "setup";
  st.settings = { ...DEFAULT_SETTINGS, ...(raw.settings||{}) };
  st.groups = raw.groups || {};
  Object.values(st.groups).forEach(g => { g.products = g.products || {}; Object.values(g.products).forEach(p => { p.acts = p.acts || []; }); });
  st.rounds = { current: raw.rounds?.current || null, status: raw.rounds?.status || {} };
  st.voters = raw.voters || {};
  Object.values(st.voters).forEach(v => { v.scores = v.scores || {}; });
  return st;
}

/* ============================= 저장소 ============================= */
function readLocal(){ try{ return JSON.parse(localStorage.getItem(ROOT) || "{}"); }catch(e){ return {}; } }
function setDeep(obj, path, val){
  const parts = path.split("/"); let cur = obj;
  for(let i=0;i<parts.length-1;i++){ if(typeof cur[parts[i]] !== "object" || cur[parts[i]] === null) cur[parts[i]] = {}; cur = cur[parts[i]]; }
  if(val === null || val === undefined) delete cur[parts[parts.length-1]]; else cur[parts[parts.length-1]] = val;
}
async function readRoot(){
  if(useFirebase){ const snap = await get(ref(db, ROOT)); return snap.exists() ? snap.val() : {}; }
  return readLocal();
}
async function writePath(path, val){
  try{
    if(useFirebase){ await set(ref(db, `${ROOT}/${path}`), val); }
    else { const r = readLocal(); setDeep(r, path, val); localStorage.setItem(ROOT, JSON.stringify(r)); await refreshAll(); }
    return true;
  }catch(e){ console.error("저장 실패", path, e); alert("저장에 실패했어요. Firebase 설정이나 인터넷 연결을 확인해 주세요."); return false; }
}
async function deletePath(path){
  try{
    if(useFirebase){ await remove(ref(db, `${ROOT}/${path}`)); }
    else { const r = readLocal(); setDeep(r, path, null); localStorage.setItem(ROOT, JSON.stringify(r)); await refreshAll(); }
  }catch(e){ console.error("삭제 실패", path, e); }
}
async function refreshAll(){ S = normalize(await readRoot()); render(); }
function startRealtimeSync(){
  if(useFirebase){ onValue(ref(db, ROOT), snap => { S = normalize(snap.exists() ? snap.val() : {}); render(); }); }
  else { window.addEventListener("storage", e => { if(e.key === ROOT) refreshAll(); }); }
}

const aiMode = () => AI_CONFIG.proxyUrl ? "proxy" : (AI_CONFIG.apiKey ? "direct" : "none");
async function callAI(system, userText){
  const body = { model: AI_CONFIG.model, max_tokens: 700, system, messages:[{ role:"user", content:userText }] };
  let res;
  if(AI_CONFIG.proxyUrl){
    res = await fetch(AI_CONFIG.proxyUrl, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
  } else if(AI_CONFIG.apiKey){
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-api-key":AI_CONFIG.apiKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify(body),
    });
  } else throw new Error("AI 미설정");
  if(!res.ok) throw new Error("AI 응답 오류 " + res.status);
  const data = await res.json();
  const text = (data.content||[]).map(c => c.text||"").join("\n");
  const clean = text.replace(/```json|```/g,"").trim();
  const s = clean.indexOf(clean.trim().startsWith("[") ? "[" : "{");
  return JSON.parse(clean.slice(s));
}
function fallbackCost(acts, terrain){
  const pool = ACTIVITIES[terrain];
  const ws = acts.map(a => { const f = pool.find(x => x.n === a); return f ? f.w : 1; });
  const maxW = Math.max(0, ...ws), sumW = ws.reduce((a,b) => a+b, 0);
  let extra = maxW === 2 ? 100 : maxW === 1 ? 50 : 0;
  if(sumW >= 4 || acts.length >= 4) extra = Math.min(150, extra + 50);
  const reason = extra === 0 ? "걷고 보고 사진 찍는 체험이라 큰 시설이 필요 없어요."
    : extra === 50 ? "장비를 빌려주거나 안전 요원이 필요한 체험이 있어요."
    : extra === 100 ? "보트나 열차처럼 큰 시설이 필요한 체험이 들어 있어요."
    : "호텔, 헬기, 크루즈처럼 아주 큰 시설이 필요한 체험이에요.";
  return { extra, reason, tip:"체험을 한두 개 줄이면 개발비를 아낄 수 있어요." };
}
async function estimateCost(terrain, region, name, ad, acts){
  if(aiMode() === "none") return { ...fallbackCost(acts, terrain), by:"rule" };
  const system = `너는 초등학교 6학년 사회 수업 '랜드마크 주식회사' 게임의 개발비 심사위원이다.
학생 팀이 만든 관광 상품의 '추가 개발비'를 정한다. 기본 개발비는 ${BASE_COST}이고, 추가 개발비는 0, 50, 100, 150 중 하나만 고른다.
기준: 걷기·사진·산책·전망대·별 보기처럼 시설이 거의 필요 없으면 0 / 장비 대여, 강습, 캠핑, 카약처럼 준비물과 안전 요원이 필요하면 50 / 보트, 케이블카, 열차, 조명 쇼처럼 큰 시설이 필요하면 100 / 호텔, 헬기, 크루즈, 잠수함처럼 아주 큰 시설이면 150.
체험이 4개 이상이면 한 단계 올린다(최대 150). 반드시 JSON만 출력한다.
{"extra": 숫자, "reason": "초등학생이 이해할 수 있는 한 문장(존댓말, 45자 이내, 왜 그 금액인지)", "tip": "돈을 아끼거나 상품을 더 멋지게 만들 팁 한 문장(존댓말, 45자 이내)"}`;
  const user = `지형: ${TERRAINS[terrain].label}\n지역: ${region?.name || ""}\n상품 이름: ${name}\n광고 문구: ${ad}\n체험: ${acts.join(", ") || "(없음)"}`;
  try{
    const r = await callAI(system, user);
    const extra = [0,50,100,150].includes(Number(r.extra)) ? Number(r.extra) : fallbackCost(acts, terrain).extra;
    return { extra, reason:String(r.reason||""), tip:String(r.tip||""), by:"ai" };
  }catch(e){ console.warn("AI 개발비 실패, 규칙 기반 사용", e); return { ...fallbackCost(acts, terrain), by:"rule" }; }
}
async function getIdeas(terrain, region){
  if(aiMode() === "none") return { list: CANNED_IDEAS[region.id] || [], by:"rule" };
  const pool = ACTIVITIES[terrain].map(a => a.n).join(", ");
  const system = `너는 초등학교 6학년 학생들의 관광 상품 개발을 도와주는 친절한 선생님이다. 아래 지역을 관광지로 개발할 때 만들 수 있는 관광 상품 아이디어 3개를 쉬운 말로 제안한다.
어려운 단어는 쓰지 않는다. 아이들이 자기 힘으로 더 발전시킬 수 있게 힌트 수준으로 준다. 반드시 JSON 배열만 출력한다.
[{"name":"상품 이름(14자 이내)","ad":"광고 한 줄(30자 이내, 재미있게)","activities":["체험1","체험2"]}]
activities는 반드시 다음 목록에서만 2~3개 고른다: ${pool}`;
  const user = `지형: ${TERRAINS[terrain].label}\n지역: ${region.name} (${region.sub})\n지역 설명: ${region.desc}`;
  try{
    const r = await callAI(system, user);
    const list = (Array.isArray(r) ? r : []).slice(0,3).map(x => ({ name:String(x.name||""), ad:String(x.ad||""), activities:(x.activities||[]).map(String) }));
    if(list.length === 0) throw new Error("빈 응답");
    return { list, by:"ai" };
  }catch(e){ console.warn("AI 아이디어 실패, 준비된 아이디어 사용", e); return { list: CANNED_IDEAS[region.id] || [], by:"rule" }; }
}

/* ============================= 계산 ============================= */
const groupList = () => Object.values(S.groups).sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
const productsOf = g => Object.values(g.products || {}).sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
function allProducts(){ return groupList().flatMap(g => productsOf(g).map(p => ({ ...p, group:g }))); }
function productsOfTerrain(t){ return allProducts().filter(p => p.group.terrain === t); }
function spent(g){ return productsOf(g).reduce((s,p) => s + (p.cost||0), 0); }
function remaining(g){ return (g.capital||0) - spent(g); }
function productStats(pid){
  let total = 0, n = 0;
  Object.values(S.voters).forEach(v => { const s = Number(v.scores?.[pid]); if(s > 0){ total += s; n++; } });
  return { total, n, avg: n ? (total/n).toFixed(1) : "-" };
}
function participants(t){
  const ids = new Set(productsOfTerrain(t).map(p => p.id));
  return Object.values(S.voters).filter(v => Object.keys(v.scores||{}).some(pid => ids.has(pid))).length;
}
function terrainWinner(t){
  const ps = productsOfTerrain(t).map(p => ({ ...p, st: productStats(p.id) })).sort((a,b) => b.st.total - a.st.total);
  return ps.length && ps[0].st.total > 0 ? ps[0] : null;
}
function settlementFor(g){
  const price = S.settings.pricePerPoint, bonus = S.settings.winBonus;
  const winnerIds = new Set(TERRAIN_ORDER.map(t => terrainWinner(t)?.id).filter(Boolean));
  const lines = productsOf(g).map(p => { const st = productStats(p.id); const won = winnerIds.has(p.id); return { ...p, st, revenue: st.total*price, won, bonus: won ? bonus : 0 }; });
  const revenue = lines.reduce((s,l) => s + l.revenue, 0);
  const bonusSum = lines.reduce((s,l) => s + l.bonus, 0);
  return { lines, spent: spent(g), remaining: remaining(g), revenue, bonus: bonusSum, final: remaining(g) + revenue + bonusSum };
}
function myTerrainStatus(t){ return S.rounds.status[t] || "idle"; }

async function developProduct(){

  if(draft.acts.length === 0) return alert("체험을 1개 이상 골라 주세요.");
  if(!draft.ai) return alert("먼저 'AI에게 개발비 물어보기'를 눌러 주세요.");
  const cost = BASE_COST + draft.ai.extra;
  if(remaining(g) < cost) return alert(`자본금이 부족해요. (필요 ${cost}, 남은 자본금 ${remaining(g)})`);

  });

function useIdea(i){
  const it = ideas?.list?.[i]; if(!it) return;
  const g = S.groups[myGroupId]; const pool = ACTIVITIES[g.terrain].map(a => a.n);
  draft.name = it.name; draft.ad = it.ad; draft.acts = it.activities.filter(a => pool.includes(a)); draft.ai = null;
  showToast("아이디어를 가져왔어요. 우리 팀만의 이름으로 바꿔 보세요!"); render();
  document.getElementById("devForm")?.scrollIntoView({ behavior:"smooth" });
}

/* ============================= 동작: 투표자 ============================= */
async function registerVoter(name){
  name = String(name||"").trim(); if(!name) return alert("이름(별명)을 입력해 주세요. 예: 지우 엄마, 6학년 민준");
  if(!voterId){ voterId = "v_" + Date.now() + "_" + Math.random().toString(36).slice(2,7); localStorage.setItem("lm2-voter-id", voterId); }
  voterName = name; localStorage.setItem("lm2-voter-name", name);
  await writePath(`voters/${voterId}`, { id: voterId, name, scores: S.voters[voterId]?.scores || {}, updatedAt: Date.now() });
  render();
}
async function submitVotes(){
  const t = S.rounds.current; if(!t || myTerrainStatus(t) !== "open") return;
  const ps = productsOfTerrain(t);
  const missing = ps.filter(p => !voteDraft[p.id]);
  if(missing.length) return alert(`아직 점수를 주지 않은 상품이 ${missing.length}개 있어요. 모든 상품에 별점을 주세요.`);
  const scores = { ...(S.voters[voterId]?.scores || {}) };
  ps.forEach(p => { scores[p.id] = voteDraft[p.id]; });
  const ok = await writePath(`voters/${voterId}`, { id: voterId, name: voterName, scores, updatedAt: Date.now() });
  if(ok) showToast("✅ 투표를 제출했어요! 고맙습니다.");
}

/* ============================= 렌더: 공통 ============================= */
function showToast(msg){ toast = msg; render(); setTimeout(() => { if(toast === msg){ toast = ""; render(); } }, 2500); }
function syncVoteDraft(){ // 이미 제출한 별점은 다시 들어와도 보이도록
  const mine = S.voters[voterId]?.scores; if(mine) Object.entries(mine).forEach(([pid,s]) => { if(!voteDraft[pid]) voteDraft[pid] = s; });
}
function render(){
  if(role === "voter" && voterId) syncVoteDraft();
  const active = document.activeElement; let saved = null;
  if(active && active.id && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) saved = { id:active.id, value:active.value, start:active.selectionStart, end:active.selectionEnd };
  renderStepper(); renderRoleSwitch();
  const app = document.getElementById("app");
  if(!role){ app.innerHTML = renderGate(); attachGate(); }
  else if(role === "teacher"){ app.innerHTML = renderTeacher(); attachTeacher(); }
  else if(role === "voter"){ app.innerHTML = renderVoter(); attachVoter(); }
  else {
    if(!myGroupId || !S.groups[myGroupId]){ myGroupId = null; app.innerHTML = renderGroupPick(); attachGroupPick(); }
    else { app.innerHTML = renderGroupView(); attachGroupView(); }
  }
  if(toast) app.insertAdjacentHTML("afterbegin", `<div class="banner settle" style="position:sticky;top:78px;z-index:30;">${escapeHtml(toast)}</div>`);
  if(saved){ const el = document.getElementById(saved.id); if(el){ el.value = saved.value; el.focus(); try{ el.setSelectionRange(saved.start, saved.end); }catch(e){} } }
  renderQR();
}
function renderStepper(){
  const idx = PHASES.indexOf(S.phase);
  document.getElementById("stepperMount").innerHTML = PHASES.map((p,i) => `<div class="step ${p===S.phase?'active':i<idx?'done':''}"><span class="dot"></span>${i+1}. ${PHASE_LABEL[p]}</div>`).join("");
}
function renderRoleSwitch(){
  const m = document.getElementById("roleSwitch");
  m.innerHTML = `<button data-role="teacher" class="${role==='teacher'?'active':''}">🖥️ 선생님</button><button data-role="group" class="${role==='group'?'active':''}">🧑‍🤝‍🧑 팀</button><button data-role="voter" class="${role==='voter'?'active':''}">🗳️ 투표</button>`;
  m.querySelectorAll("button").forEach(b => b.onclick = () => { role = b.dataset.role; render(); });
}
function voteUrl(){ return location.origin + location.pathname + "?mode=vote"; }
function renderQR(){
  const el = document.getElementById("qr"); if(!el || !window.QRCode) return;
  el.innerHTML = "";
  if(location.protocol === "file:"){ el.innerHTML = `<span style="color:#333;font-size:12px;text-align:center;">배포 후<br>QR이 나와요</span>`; return; }
  new QRCode(el, { text: voteUrl(), width:160, height:160 });
}
function qrPanel(title){
  return `<div class="panel"><h2 class="section-title" style="font-size:18px;">${title}</h2>
    <div class="qr-box"><div id="qr"></div><div><p class="muted" style="margin:0 0 8px;line-height:1.6;">학부모님과 학생들은 QR을 찍으면 바로 투표 화면으로 들어와요.<br>이름(별명)만 적으면 투표할 수 있어요.</p><div class="qr-url">${escapeHtml(voteUrl())}</div></div></div></div>`;
}
function headStyle(item){ return item.photo && PHOTOS[item.photo] ? `background-image:url('${PHOTOS[item.photo]}');` : `background:linear-gradient(135deg,${item.g[0]},${item.g[1]});`; }
function actTags(acts){ return acts.map(a => `<span class="tag act">${escapeHtml(a)}</span>`).join(""); }

  const bannerText = { setup:"👋 팀을 추가하고 개발 TIME을 시작해 주세요.", develop:"🛠️ 개발 TIME! 팀들이 자기 지역의 관광 상품을 개발하고 있어요.", vote:"🎤 설명회·투표 TIME! 팀이 발표하면 투표를 열어 주세요.", settle:"📊 정산 TIME! 투표 점수가 돈으로 바뀌고 최종 순위가 나왔어요." }[S.phase];
  let body = "";

  else if(S.phase === "vote") body = renderTeacherVote();
  else body = renderSettlePanel();

}

    <div class="tag-row"><span class="tag team">${escapeHtml(g.name)}</span><span class="tag">${region ? region.emoji+" "+escapeHtml(region.name) : ""}</span><span class="tag cost">개발비 ${p.cost}</span></div>

    ${st ? `<div class="revenue-line"><span>총점 <b>${st.total}</b> · ${st.n}명 · 평균 ${st.avg}점</span>${opt.price!=null?`<b>+${st.total*opt.price}${p._bonus?` +보너스 ${p._bonus}`:""}</b>`:""}</div>` : ""}

function renderTeacherVote(){
  const cur = S.rounds.current;
  const allClosed = TERRAIN_ORDER.filter(t => productsOfTerrain(t).length).every(t => myTerrainStatus(t) === "closed");

    const btn = n === 0 ? `<span class="muted" style="font-size:12px;">상품 없음</span>`
      : st === "idle" ? `<button class="btn btn-coral" data-round="${t}" data-st="open">발표 끝 → 투표 열기</button>`
      : st === "open" ? `<button class="btn btn-mint" data-round="${t}" data-st="closed">투표 마감 & 결과 공개</button>`
      : `<button class="btn btn-ghost" data-round="${t}" data-st="closed">결과 보기</button><button class="btn btn-ghost" data-round="${t}" data-st="open">다시 열기</button>`;

  }).join("");
  let stage = "";
  if(cur){
    const st = myTerrainStatus(cur), ps = productsOfTerrain(cur), price = S.settings.pricePerPoint;
    const winner = st === "closed" ? terrainWinner(cur) : null;
    const sorted = st === "closed" ? [...ps].sort((a,b) => productStats(b.id).total - productStats(a.id).total) : ps;

  return `<div class="two-col">
    <div class="panel"><h2 class="section-title">설명회 순서</h2><p class="section-sub">팀이 상품을 발표하면 '투표 열기'를 누르세요. 투표자들의 휴대폰에 그 팀 상품이 나타나요. 발표가 끝나면 마감해서 결과를 공개해요.</p>${rounds}
      <div class="row end" style="margin-top:14px;"><button class="btn btn-ghost" id="backDevelopBtn">개발 TIME으로</button><button class="btn btn-mint big" id="startSettleBtn" ${allClosed?"":"disabled"}>모든 투표 끝 → 정산 TIME</button></div></div>
    ${qrPanel("📱 투표 참여 QR")}
  </div>${stage}`;
}

      <div class="grid wide">${TERRAIN_ORDER.map(t => { const w = terrainWinner(t); return w ? renderProductCard({ ...w, _bonus:S.settings.winBonus }, w.group, { showScore:true, winner:true, price }) : `<div class="product muted">${TERRAINS[t].label}: 투표 결과 없음</div>`; }).join("")}</div></div>
    <div class="panel"><h2 class="section-title" style="font-size:18px;">📋 전체 상품 점수표</h2>
      <table class="roster"><thead><tr><th>상품</th><th>팀</th><th>개발비</th><th>총점</th><th>참여</th><th>평균</th><th>수익</th></tr></thead><tbody>
      ${allProducts().map(p => ({ p, st: productStats(p.id) })).sort((a,b) => b.st.total - a.st.total).map(({p,st}) => `<tr><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.group.name)}</td><td>-${p.cost}</td><td class="num">${st.total}</td><td>${st.n}명</td><td>${st.avg}</td><td class="num">+${st.total*price}</td></tr>`).join("")}
      </tbody></table></div>
    <div class="row end" style="margin-top:14px;"><button class="btn btn-ghost" id="backVoteBtn">설명회·투표 TIME으로</button></div>`;
}
function attachTeacher(){
  const q = id => document.getElementById(id);
  if(q("addGroupBtn")) q("addGroupBtn").onclick = () => addGroup(q("newGroupName").value, q("newGroupCapital").value, q("newGroupTerrain").value);
  if(q("addSampleBtn")) q("addSampleBtn").onclick = addSampleGroups;
  if(q("saveSettingsBtn")) q("saveSettingsBtn").onclick = saveSettings;
  document.querySelectorAll("[data-del]").forEach(el => el.onclick = () => removeGroup(el.dataset.del));
  document.querySelectorAll("[data-round]").forEach(el => el.onclick = () => setRound(el.dataset.round, el.dataset.st));
  if(q("startDevelopBtn")) q("startDevelopBtn").onclick = () => setPhase("develop");
  if(q("startVoteBtn")) q("startVoteBtn").onclick = () => { const nr = groupList().filter(g => productsOf(g).length < MIN_PRODUCTS); if(nr.length && !confirm(`아직 상품 ${MIN_PRODUCTS}개를 못 채운 팀이 있어요. 그래도 마감할까요?`)) return; setPhase("vote"); };
  if(q("startSettleBtn")) q("startSettleBtn").onclick = () => setPhase("settle");
  if(q("backSetupBtn")) q("backSetupBtn").onclick = () => setPhase("setup");
  if(q("backDevelopBtn")) q("backDevelopBtn").onclick = () => setPhase("develop");
  if(q("backVoteBtn")) q("backVoteBtn").onclick = () => setPhase("vote");
  if(q("resetVotesBtn")) q("resetVotesBtn").onclick = resetVotes;
  if(q("resetBtn")) q("resetBtn").onclick = resetGame;
}

/* ============================= 렌더: 팀 ============================= */
function renderGroupView(){
  const g = S.groups[myGroupId]; const T = TERRAINS[g.terrain]; const ps = productsOf(g);
  const capital = `<div class="capital-bar"><div class="who">${T.emoji} <b>${escapeHtml(g.name)}</b> · <span class="muted">${PHASE_LABEL[S.phase]}</span></div>
    <div class="capital-num">${S.phase==='settle' ? settlementFor(g).final : remaining(g)}<span>원 ${S.phase==='settle'?'(최종)':'(남은 자본금)'}</span></div>
    <div class="pill-stat">개발 상품 <b>${ps.length}</b>개 <span class="muted">/ 최소 ${MIN_PRODUCTS}, 목표 ${TARGET_PRODUCTS}</span></div></div>`;
  if(S.phase === "setup") return capital + `<div class="banner wait">선생님이 게임을 준비하고 있어요. 곧 개발 TIME이 시작돼요!</div>` + renderRegionIntro(g) + renderExamples(g);
  if(S.phase === "develop") return capital + `<div class="banner develop">🛠️ 개발 TIME! 우리 팀 지역의 관광 상품을 ${MIN_PRODUCTS}~${TARGET_PRODUCTS}개 만들어요. 기본 개발비 ${BASE_COST} + AI가 정한 추가 개발비가 들어요.</div>` + renderRegionIntro(g) + renderMyProducts(g, true) + renderDevForm(g) + renderExamples(g);
  if(S.phase === "vote"){
    const cur = S.rounds.current; const mine = cur === g.terrain;
    return capital + `<div class="banner vote">🎤 설명회·투표 TIME! ${mine ? "지금은 <b>우리 팀 발표 시간</b>이에요. 상품을 멋지게 소개해요!" : cur ? `지금은 ${TERRAINS[cur].label}팀 발표를 듣는 시간이에요.` : "선생님이 발표 순서를 정하고 있어요."}</div>
      <div class="row" style="margin-bottom:16px;"><a class="btn btn-sky" href="${voteUrl()}" target="_blank" rel="noopener">🗳️ 투표하러 가기 (새 창)</a><span class="muted" style="font-size:13px;">다른 팀 상품에 별점을 줄 때는 개인 휴대폰이나 이 버튼을 사용해요.</span></div>` + renderMyProducts(g, false);
  }
  const s = settlementFor(g);
  const rank = groupList().map(x => ({ id:x.id, f: settlementFor(x).final })).sort((a,b) => b.f - a.f).findIndex(x => x.id === g.id) + 1;
  return capital + `<div class="banner settle">📊 정산 완료! 우리 팀은 <b>${rank}등</b>이에요. (남은 자본 ${s.remaining} + 수익 ${s.revenue} + 보너스 ${s.bonus} = ${s.final})</div>
    <div class="panel"><h2 class="section-title" style="font-size:18px;">우리 팀 상품 결과</h2><div class="grid wide">${s.lines.map(l => renderProductCard({ ...l, _bonus:l.bonus }, g, { showScore:true, winner:l.won, price:S.settings.pricePerPoint })).join("")}</div></div>`;
}
function renderRegionIntro(g){
  return `<div class="panel"><h2 class="section-title" style="font-size:18px;">📍 우리 팀이 개발할 지역</h2>
    <div class="grid wide">${REGIONS[g.terrain].map(r => `<div class="dest"><div class="dest-head" style="${headStyle(r)}"><span class="emoji">${r.emoji}</span><h3>${escapeHtml(r.name)}</h3><div class="region">${escapeHtml(r.sub)}</div><div class="desc">${escapeHtml(r.desc)}</div></div></div>`).join("")}</div></div>`;
}
function renderMyProducts(g, deletable){
  const ps = productsOf(g);
  return `<div class="panel"><h2 class="section-title" style="font-size:18px;">🏗️ 우리 팀이 개발한 상품 (${ps.length}개)</h2>
    ${ps.length ? `<div class="grid wide">${ps.map(p => renderProductCard(p, g, { deletable })).join("")}</div>` : `<p class="muted">아직 없어요. 아래에서 첫 상품을 만들어 봐요!</p>`}</div>`;
}
function renderDevForm(g){
  const regions = REGIONS[g.terrain]; const regionId = draft.region || regions[0].id; const region = regionById(regionId);
  const pool = ACTIVITIES[g.terrain];
  const customs = draft.acts.filter(a => !pool.some(x => x.n === a));
  const total = draft.ai ? BASE_COST + draft.ai.extra : null;
  const canPay = total != null && remaining(g) >= total;
  const ideaBox = ideasLoading ? `<div class="ai-box">🤖 AI가 ${escapeHtml(region.name)} 아이디어를 생각하는 중이에요...</div>`
    : ideas ? `<div class="grid wide" style="margin-top:0;">${ideas.list.map((it,i) => `<div class="idea-card"><div class="name">💡 ${escapeHtml(it.name)}</div><div class="ad">“${escapeHtml(it.ad)}”</div><div class="tag-row" style="margin:4px 0;">${actTags(it.activities)}</div><button class="btn btn-ghost" data-idea="${i}">이 아이디어로 시작하기</button></div>`).join("")}</div>
      <p class="muted" style="font-size:12px;margin:8px 0 0;">${ideas.by==="ai"?"AI가 만든 힌트예요.":"준비된 아이디어예요."} 그대로 쓰지 말고 우리 팀 생각을 더해 더 멋지게 바꿔 보세요!</p>` : "";
  return `<div class="panel" id="devForm">
    <div class="row" style="justify-content:space-between;margin-bottom:6px;"><h2 class="section-title">✨ 새 관광 상품 개발하기</h2><button class="btn btn-sky" id="ideasBtn" ${ideasLoading?"disabled":""}>🆘 AI야 도와줘!</button></div>
    <p class="section-sub">어렵다면 'AI야 도와줘!'를 눌러 보세요. ${escapeHtml(region.name)}에 어울리는 아이디어를 알려줘요.</p>
    ${ideaBox}
    <div class="form-steps" style="margin-top:14px;">
      ${regions.length > 1 ? `<div class="form-step"><h4><span class="num">1</span>어느 지역을 개발할까요?</h4><div class="region-pick">${regions.map(r => `<button class="region-btn ${r.id===regionId?'on':''}" data-region="${r.id}"><b>${r.emoji} ${escapeHtml(r.name)}</b><span>${escapeHtml(r.sub)}</span></button>`).join("")}</div></div>` : ""}
      <div class="form-step"><h4><span class="num">${regions.length>1?2:1}</span>상품 이름</h4><div class="field"><input id="dName" placeholder="예: 구름 위 계단 트레킹" maxlength="30" value="${escapeAttr(draft.name)}" /></div></div>
      <div class="form-step"><h4><span class="num">${regions.length>1?3:2}</span>관광지를 광고하는 한 줄 설명</h4><div class="field"><input id="dAd" placeholder="예: 아침 안개 속 계단식 논을 걷는 인생 사진 코스!" maxlength="60" value="${escapeAttr(draft.ad)}" /></div></div>
      <div class="form-step"><h4><span class="num">${regions.length>1?4:3}</span>이곳에서 체험할 수 있는 것 <span class="muted" style="font-size:12px;font-weight:400;">(여러 개 선택 · 큰 시설이 필요할수록 개발비가 올라가요)</span></h4>
        <div class="chips">${pool.map(a => `<button class="chip ${draft.acts.includes(a.n)?'on':''}" data-act="${escapeAttr(a.n)}">${escapeHtml(a.n)}<small>${a.w===0?"소":a.w===1?"중":"대"}</small></button>`).join("")}
        ${customs.map(a => `<button class="chip on custom" data-act="${escapeAttr(a)}">✏️ ${escapeHtml(a)}</button>`).join("")}</div>
        <div class="row" style="margin-top:10px;"><div class="field" style="flex:1;min-width:180px;"><input id="dCustom" placeholder="목록에 없는 체험 직접 쓰기" maxlength="20" value="${escapeAttr(draft.customAct)}" /></div><button class="btn btn-ghost" id="addCustomBtn">추가</button></div></div>
      <div class="form-step"><h4><span class="num">${regions.length>1?5:4}</span>개발비 정하기</h4>
        <div class="row"><button class="btn btn-gold" id="askCostBtn" ${costLoading?"disabled":""}>${costLoading?"🤖 AI가 계산 중...":"🤖 AI에게 개발비 물어보기"}</button><span class="muted" style="font-size:13px;">기본 ${BASE_COST} + 추가 개발비(0~150)</span></div>
        ${draft.ai ? `<div class="ai-box" style="margin-top:12px;"><div>기본 ${BASE_COST} + 추가 <b>${draft.ai.extra}</b> = <span class="total">${total}</span> <span class="muted">(남은 자본금 ${remaining(g)})</span></div><div>💬 ${escapeHtml(draft.ai.reason)}</div>${draft.ai.tip?`<div>💡 ${escapeHtml(draft.ai.tip)}</div>`:""}
          ${!canPay ? `<div style="color:var(--coral);margin-top:6px;">😥 자본금이 부족해요. 체험을 줄이거나 다른 상품을 생각해 봐요.</div>` : ""}
          <div class="row" style="margin-top:12px;"><button class="btn btn-mint big" id="developBtn" ${canPay?"":"disabled"}>이 상품 개발하기 (−${total})</button></div></div>` : ""}
      </div>
    </div></div>`;
}
function renderExamples(g){
  const tab = exampleTab || g.terrain;
  return `<div class="panel"><h2 class="section-title" style="font-size:18px;">📚 참고: 다른 나라는 이렇게 개발했어요</h2>
    <p class="section-sub">지형별 예시 관광지 2곳씩이에요. 어떤 체험을 만들었는지, 개발비가 얼마나 들었는지 살펴보세요.</p>
    <div class="tabs">${TERRAIN_ORDER.map(t => `<button class="tab ${t===tab?'active':''}" data-tab="${t}">${TERRAINS[t].emoji} ${TERRAINS[t].label}</button>`).join("")}</div>
    <div class="grid">${EXAMPLES[tab].map(d => `<div class="dest"><div class="dest-head" style="${headStyle(d)}"><span class="emoji">${d.emoji}</span><h3>${escapeHtml(d.name)}</h3><div class="region">${escapeHtml(d.region)}</div></div>
      <div class="dest-body">${d.products.map(p => `<div class="product"><div class="product-name">${escapeHtml(p.name)}</div><div class="product-desc">${escapeHtml(p.ad)}</div><div class="tag-row"><span class="tag cost">개발비 ${p.cost}</span>${actTags(p.acts)}</div></div>`).join("")}</div></div>`).join("")}</div></div>`;
}
function attachGroupView(){
  const q = id => document.getElementById(id);
  document.querySelectorAll("[data-tab]").forEach(el => el.onclick = () => { exampleTab = el.dataset.tab; render(); });
  document.querySelectorAll("[data-delp]").forEach(el => el.onclick = () => removeProduct(el.dataset.delp));
  document.querySelectorAll("[data-region]").forEach(el => el.onclick = () => { draft.region = el.dataset.region; draft.ai = null; ideas = null; render(); });
  document.querySelectorAll("[data-act]").forEach(el => el.onclick = () => { const a = el.dataset.act; draft.acts = draft.acts.includes(a) ? draft.acts.filter(x => x !== a) : [...draft.acts, a]; draft.ai = null; render(); });
  document.querySelectorAll("[data-idea]").forEach(el => el.onclick = () => useIdea(Number(el.dataset.idea)));
  if(q("dName")) q("dName").oninput = e => { draft.name = e.target.value; draft.ai = null; };
  if(q("dAd")) q("dAd").oninput = e => { draft.ad = e.target.value; };
  if(q("dCustom")) q("dCustom").oninput = e => { draft.customAct = e.target.value; };
  if(q("addCustomBtn")) q("addCustomBtn").onclick = () => { const a = draft.customAct.trim(); if(!a) return; if(!draft.acts.includes(a)) draft.acts.push(a); draft.customAct = ""; draft.ai = null; render(); };
  if(q("ideasBtn")) q("ideasBtn").onclick = askIdeas;
  if(q("askCostBtn")) q("askCostBtn").onclick = askCost;
  if(q("developBtn")) q("developBtn").onclick = developProduct;
}

/* ============================= 렌더: 투표자 ============================= */
function renderVoter(){
  if(!voterId || !voterName) return `<div class="gate"><div style="font-size:44px;">🗳️</div><h2>랜드마크 주식회사 관광 상품 투표</h2>
    <p class="muted" style="line-height:1.6;">아이들이 직접 개발한 관광 상품 설명회입니다.<br>설명을 듣고 각 상품에 1~5점 별점을 주세요.</p>
    <div class="field" style="width:100%;max-width:340px;margin-top:14px;"><input id="voterNameInput" placeholder="이름 또는 별명 (예: 지우 엄마, 6학년 민준)" maxlength="20" /></div>
    <button class="btn btn-gold big" id="voterStartBtn" style="margin-top:12px;">입장하기</button></div>`;
  const cur = S.rounds.current, st = cur ? myTerrainStatus(cur) : "idle";
  const hello = `<div class="capital-bar" style="margin-top:0;"><div class="who">안녕하세요, <b>${escapeHtml(voterName)}</b>님 🙌</div><button class="del-btn" id="changeNameBtn">이름 바꾸기</button></div>`;
  if(S.phase === "settle") return hello + `<div class="gate" style="padding:40px 20px;"><div style="font-size:44px;">🎉</div><h2>투표가 모두 끝났어요</h2><p class="muted">참여해 주셔서 고맙습니다! 결과는 교실 화면에서 확인해 주세요.</p></div>`;
  if(S.phase !== "vote" || !cur || st !== "open"){
    const msg = S.phase !== "vote" ? "아직 투표 시간이 아니에요. 잠시만 기다려 주세요." : cur && st === "closed" ? `${TERRAINS[cur].label}팀 투표가 마감됐어요. 다음 팀 발표를 들어 주세요.` : cur ? `${TERRAINS[cur].label}팀 발표를 듣고 있어요. 곧 투표가 열려요.` : "선생님이 발표 순서를 정하고 있어요.";
    return hello + `<div class="gate" style="padding:40px 20px;"><div style="font-size:44px;">⏳</div><h2>잠시만요!</h2><p class="muted">${msg}</p><p class="muted" style="font-size:12px;">이 화면은 자동으로 바뀌어요. 새로고침하지 않아도 돼요.</p></div>`;
  }
  const ps = productsOfTerrain(cur);
  const mine = S.voters[voterId]?.scores || {};
  const submitted = ps.length && ps.every(p => mine[p.id] && mine[p.id] === voteDraft[p.id]);
  const done = Object.keys(voteDraft).filter(id => ps.some(p => p.id === id)).length;
  return hello + `<div class="banner vote">${TERRAINS[cur].emoji} <b>${TERRAINS[cur].label}팀</b> 관광 상품에 점수를 주세요. 관광객이라면 정말 가고 싶은지, 돈값을 하는지 생각해 보세요!</div>
    ${ps.map(p => { const r = regionById(p.region); const v = voteDraft[p.id] || 0; return `<div class="vote-card">
      <div class="product-name">${escapeHtml(p.name)}</div><div class="product-desc">“${escapeHtml(p.ad)}”</div>
      <div class="tag-row"><span class="tag team">${escapeHtml(p.group.name)}</span><span class="tag">${r ? r.emoji+" "+escapeHtml(r.name) : ""}</span><span class="tag cost">개발비 ${p.cost}</span></div>
      <div class="tag-row">${actTags(p.acts)}</div>
      <div class="row" style="justify-content:space-between;margin-top:6px;"><div class="stars">${[1,2,3,4,5].map(n => `<button class="star ${n<=v?'on':''}" data-star="${n}" data-pid="${p.id}">★</button>`).join("")}</div><span class="muted" style="font-size:13px;">${v ? v+"점" : "별을 눌러 주세요"}</span></div></div>`; }).join("")}
    <div style="position:sticky;bottom:12px;">
      <button class="btn btn-gold big" id="submitVotesBtn" style="width:100%;" ${done<ps.length?"disabled":""}>${submitted ? "✅ 제출 완료 (바꾸려면 별점 수정 후 다시 제출)" : `투표 제출하기 (${done}/${ps.length})`}</button></div>`;
}
function attachVoter(){
  const q = id => document.getElementById(id);
  if(q("voterStartBtn")) q("voterStartBtn").onclick = () => registerVoter(q("voterNameInput").value);
  if(q("voterNameInput")) q("voterNameInput").onkeydown = e => { if(e.key === "Enter") registerVoter(e.target.value); };
  if(q("changeNameBtn")) q("changeNameBtn").onclick = () => { voterName = ""; localStorage.removeItem("lm2-voter-name"); render(); };
  document.querySelectorAll("[data-star]").forEach(el => el.onclick = () => { voteDraft[el.dataset.pid] = Number(el.dataset.star); render(); });
  if(q("submitVotesBtn")) q("submitVotesBtn").onclick = submitVotes;
}

/* ============================= utils ============================= */
function escapeHtml(str){ return String(str ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function escapeAttr(str){ return escapeHtml(str); }

/* ============================= init ============================= */
if(new URLSearchParams(location.search).get("mode") === "vote") role = "voter";
startRealtimeSync();
refreshAll();
</script>
